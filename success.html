<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GDE Digital Store — Order</title><style>body{background:#091622;color:#ecf8f4;font:16px system-ui;margin:0;padding:8vh 20px}main{max-width:630px;margin:auto;background:#132638;border:1px solid #2e5e60;padding:35px;border-radius:18px}button{padding:14px 22px;background:#7ce7ca;border:0;border-radius:8px;font-weight:bold;cursor:pointer}p{line-height:1.6;color:#c9dfdc}a{color:#7ce7ca}</style><main><h1>Thank you for your order</h1><p id="status">Verifying your payment with Stripe…</p><button id="download" hidden>Download your PDF bundle</button><p><a href="/">Return to the GDE Digital Store</a></p></main><script>const sid=new URLSearchParams(location.search).get('session_id');const status=document.getElementById('status'),btn=document.getElementById('download');if(!sid){status.textContent='Your payment may be complete. If you were not redirected with an order reference, contact store support with your receipt.'}else{fetch('/.netlify/functions/verify-order?session_id='+encodeURIComponent(sid)).then(r=>r.json()).then(d=>{if(d.paid){status.textContent='Payment verified. Your purchased PDF is ready.';btn.hidden=false;btn.onclick=()=>{location.href='/.netlify/functions/download?session_id='+encodeURIComponent(sid)}}else{status.textContent='Payment is not yet confirmed. Please wait and refresh this page.'}}).catch(()=>status.textContent='Unable to verify right now. Please try again shortly.')}</script></html>
